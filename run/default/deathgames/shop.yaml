refunds: # shop entries that refund other shop entries. works best with upgrades. item display is based on buy option. refunds: []  to disable.
  - row: 1 # where the refund button sits
    col: 0
    targetRow: 0 # where the buy option sits, that should get refunded.
    targetCol: 0
  - row: 1
    col: 1
    targetRow: 0
    targetCol: 1
  - row: 1
    col: 2
    targetRow: 0
    targetCol: 2
  - row: 1
    col: 6
    targetRow: 0
    targetCol: 6
  - row: 1
    col: 7
    targetRow: 0
    targetCol: 7
  - row: 1
    col: 4
    targetRow: 0
    targetCol: 4
  - row: 1
    col: 5
    targetRow: 0
    targetCol: 5
traps: # custom trap implementation that applies potion effects on trigger and may snare if wanted. use item on top of a block. traps: []  to disable.
  - row: 3
    col: 7
    name: 'Stop right there, criminal scum!'
    price: 10
    snare: true # whether trapped players are unable to move including camera.
    effectNBTs: # list of string NBT potion effects
      - '{ambient:0b,amplifier:100b,duration:140,id:blindness,show_icon:0b,show_particles:0b}'
    triggerRange: 0.5 # (in blocks) how far away a player must be to activate trap
    setupTime: 200 # (in ticks) how long after placing the trap can be triggered
    triggerVisibilityRange: 30 # (in blocks) range in which other players can see that a trap has been triggered
    visibilityRange: 10 # (in blocks) range in which a placed trap can theoretically be seen
    affectedRange: 1.5 # (in blocks) on trigger, apply effects to all players in this range
    triggerDuration: 120 # (in ticks) only relevant when snaring. how long a player will be snared.
  - row: 3
    col: 8
    name: The Abyss
    price: 10
    snare: false
    effectNBTs:
      - '{ambient:0b,amplifier:100b,duration:140,id:blindness,show_icon:0b,show_particles:0b}'
      - '{ambient:0b,amplifier:0b,duration:120,id:slowness,show_icon:0b,show_particles:0b}'
      - '{ambient:0b,amplifier:0b,duration:120,id:levitation,show_icon:0b,show_particles:0b}'
    triggerRange: 0.5
    setupTime: 200
    triggerVisibilityRange: 30
    visibilityRange: 10
    affectedRange: 1.5
    triggerDuration: 120
  - row: 3
    col: 6
    name: Sonicification
    price: 10
    snare: false
    effectNBTs:
      - '{ambient:0b,amplifier:100b,duration:40,id:speed,show_icon:0b,show_particles:0b}'
    triggerRange: 1
    setupTime: 40
    triggerVisibilityRange: 30
    visibilityRange: 5
    affectedRange: 5
    triggerDuration: 120
refundRecent: # button for refunding recent purchases. only works until the player leaves shop. refundRecent: null  to disable.
  row: 5
  col: 4
  name: Refund recent purchases
hook: # custom grappling hook implementation. right click to launch towards targeted block. right click again to cancel flight. hook: null  to disable.
  row: 4
  col: 8
  name: Grappling Hook
  price: 35
  maxDistance: 30 # (in blocks) how far the hook can reach
  cooldown: 40 # (in ticks) how long the hook will be disabled for after disengaging
