# this file describes all shop entries in a double chest inventory interface. row and col are 0-indexed, which means 0 <= col <= 8 and 0 <= row <= 5
# i have preset a lot of options from which you can be inspired to create a crazy custom shop!
items: # standard items, that can be bought indefinitely. items: []  to disable.
