shield: # shields are handled separately, so that durability can be added on multiple buy operations. shield: null  to disable.
  row: 0
  col: 3
  name: Shield
  durability: 120 # how much durability should be added on existing shields. if no shields exist, player will get a new one with this amount of durability.
  price: 50
extraLife: # players can buy one additional respawn at a time and even respawn dead players when no respawns are left. extraLife: null  to disable.
  row: 4
  col: 1
  name: Extra Life
  id: 'minecraft:turtle_egg' # which item gets displayed
  amount: 1 # NOT HOW MANY LIVES GET ADDED, just determines how many items are displayed
  components: '' # data components of display item
  price: 100
leaveShop: # players can leave shop early to tp to their spawn point. leaveShop: null  to disable
  row: 5
  col: 8
