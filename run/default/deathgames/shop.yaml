    col: 0
    name: Melon # will be shown on hover
    id: 'minecraft:melon_slice' # what item will be given. is also the appearance of item in shop inventory.
    amount: 8 # how many will be given
    components: '' # (in string NBT format) additional components. when setting infinite:true in custom data, the item cannot be consumed.
    price: 5
